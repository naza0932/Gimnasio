<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi perfil - Gimnasio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">

    <h3>Mi perfil<h3>
    <p class="text-muted">Consulta y actualiza tus datos personales</p>
    
    <!--Mnesaje de actualización-->
    
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

    <!--Mnesaje de error-->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!--Formulario para actualizar el perfil-->
    <form th:action="@{/mi-perfil/actualizar}" th:object="${usuario}" method="post">

        <!--Nombre-->
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control">
            <div class="text-danger" th:errors="*{nombre}"></div>
        </div>

        <!--Cédula-->
        <div class="mb-3">
            <label class="form-label">Cédula</label>
            <input type="text" th:field="*{cedula}" class="form-control">
            <div class="text-danger" th:errors="*{cedula}"></div>
        </div>

        <!--correo electrónico-->
        <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" th:field="*{email}" class="form-control" readonly>
        </div>

        <!--Teléfono-->
        <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input type="text" th:field="*{telefono}" class="form-control">
            <div class="text-danger" th:errors="*{telefono}"></div>
        </div>

        <!--Contraseña-->
        <div class="mb-3">
            <label class="form-label">Nueva contraseña</label>
            <input type="password" th:field="*{password}" class="form-control">
            <small class="text-muted">Deja este campo vacío si no deseas cambiar la contraseña</small>
            <div class="text-danger" th:errors="*{password}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar cambios</button>
        <a th:href="@{/inicio}" class="btn btn-secondary">Volver</a>
    </form>
</div>
</body>
</html>
