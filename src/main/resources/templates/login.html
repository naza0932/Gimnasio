<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gimnasio - Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 400px; margin-top: 10vh;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="mb-4 text-center">Iniciar sesión</h3>

            <!--Mostrar mensaje si los datos puestos son incorrectos o la cuenta se encuentra inactiva-->
            <div th:if="${param.error}" class="alert alert-danger">Correo o contraseña incorrectos o cuenta inactiva</div>

            <!-- Mostrar mensaje al cerrar la sesión -->
            <div th:if="${param.logout}" class="alert alert-success">Has cerrado sesión correctamente</div>
            <!-- Formulario de inicio de sesión-->
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" name="email" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>

            <p class="text-muted small mt-3 mb-0 text-center">¿No tiene una cuenta? <a href="@{/registro}">Regístrese aquí</a></p>
        </div>
    </div>
</div>
</body>
</html>
