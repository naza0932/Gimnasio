<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar usuario del gimnasio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4" style="max-width: 600px;">
    <h4>Editar usuario</h4>

    <!--Mostrar mensaje de error-->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!--Formulario para actualizar datos de los usuarios-->
    <form th:object="${usuario}" method="post" th:action="@{/usuarios/{id}/actualizar(id=${usuario.id})}">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control"
                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Cédula</label>
            <input type="text" th:field="*{cedula}" class="form-control"
                   th:classappend="${#fields.hasErrors('cedula')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{cedula}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" th:field="*{email}" class="form-control"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>


        <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input type="text" th:field="*{telefono}" class="form-control"
                   th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{telefono}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" th:field="*{password}" class="form-control">
            <div class="form-text">Déjala vacía para no cambiarla.</div>
        </div>

        <div class="mb-3">
            <label class="form-label">Rol</label>
            <select th:field="*{rol}" class="form-select">
                <option value="CLIENTE">CLIENTE</option>
                <option value="ENTRENADOR">ENTRENADOR</option>
            </select>
        </div>


        <div class="form-check mb-3">
            <input type="checkbox" th:field="*{activo}" class="form-check-input">
            <label class="form-check-label">Usuario activo</label>
          
        </div>

        <button type="submit" class="btn btn-primary">Guardar cambios</button>
        <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
