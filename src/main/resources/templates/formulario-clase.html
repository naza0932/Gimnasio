<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de clases</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <h2 th:text="${modo == 'crear'} ? 'Registrar clase' : 'Editar clase' "></h2>
    
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:object="${clase}" method="post" th:action="${modo == 'crear'} ? @{/clases/guardar} : @{/clases/{id}/actualizar(id=${clase.id})}">

        <!--Nombre de la clase-->
        <div class="mb-3">
            <label class="form-label">Nombre de la clase</label>
            <input type="text" th:field="*{nombre}" class="form-control">
            <div class="text-danger" th:errors="*{nombre}"></div>
        </div>

        <!--Tipo de actividad-->
        <div class="mb-3">
            <label class="form-label">Tipo de clase</label>
            <input type="text" th:field="*{tipo}" class="form-control">
            <div class="text-danger" th:errors="*{tipo}"></div>
        </div>

        <!--Entrenador-->
        <div class="mb-3">
            <label class="form-label">Entrenador</label>
            <select name="entrenadorId" class="form-select" required>
                <option value="">Seleccione un entrenador</option>
                <option th:each="entrenador : ${entrenadores}" th:value="${entrenador.id}" th:text="${entrenador.nombre}" th:selected="${clase.entrenador != null && clase.entrenador.id == entrenador.id}"></option>
            </select>
        </div>

        <!--Fecha de clase-->
        <div class="mb-3">
            <label class="form-label">Fecha</label>
            <input type="date" th:field="*{fecha}" class="form-control">
            <div class="text-danger" th:errors="*{fecha}"></div>
        </div>

        <!--Hora de inicio de clase-->
        <div class="mb-3">
            <label class="form-label">Hora de inicio</label>
            <input type="time" th:field="*{horaInicio}" class="form-control">
            <div class="text-danger" th:errors="*{horaInicio}"></div>
        </div>

        <!--Capacidad de cupos para la clase-->
        <div class="mb-3">
            <label class="form-label">Capacidad máxima</label>
            <input type="number" th:field="*{capacidad}" class="form-control">
            <div class="text-danger" th:errors="*{capacidad}"></div>
        </div>

        <button type="submit" class="btn btn-primary" th:text="${modo == 'crear'} ? 'Guardar clase' : 'Actualizar clase'"></button>
        <a th:href="@{/clases}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
