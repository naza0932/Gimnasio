<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de clases</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2>Gestión de clases del gimnasio</h2>


    <!--Mnesaje de confirmación-->
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

    <!--Botón para registrar una clase-->
    <a th:href="@{/clases/nueva}" class="btn btn-success mb-3">Registrar nueva clase</a>

    <!--Tabla de clases-->
    <table class="table table-bordered table-striped">

        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Tipo</th>
                <th>Entrenador</th>
                <th>Fecha</th>
                <th>Hora de inicio</th>
                <th>Hora de finalización</th>
                <th>Capacidad</th>
                <th>Acciones</th>
            </tr> 
        </thead>

        <tbody>

            <tr th:each="clase : ${clases}">
                <td th:text="${clase.id}"></td>
                <td th:text="${clase.nombre}"></td>
                <td th:text="${clase.tipo}"></td>
                <td th:text="${clase.entrenador.nombre}"></td>
                <td th:text="${clase.fecha}"></td>
                <td th:text="${clase.horaInicio}"></td>
                <td th:text="${clase.horaFin}"></td>
                <td th:text="${clase.capacidad}"></td>

                <td>
                    <a th:href="@{/clases/{id}/editar(id=${clase.id})}" class="btn btn-primary btn-sm">
                        Editar
                    </a>
                </td>
            </tr>    
        </tbody>
    </table>

    <a th:href="@{/inicio}" class="btn btn-secondary">Volver al inicio</a>

</div>
</body>
</html>
