<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Gestión de usuarios - Gimnasio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

     <!--Barra supereior del sistema-->  
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">Gestion de usuarios</span>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white">Hola, <b sec:authentication="name"></b></span>
             <!--Botón para poder cerrar la sesión-->  
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light btn-sm">Salir</button>
            </form>
        </div>
    </nav>

<div class="container mt-4">
     <!--Mensaje del sistema-->  
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Lista de usuarios</h4>
        
        
        <!--Buscar usuarios por nombre-->  
        <form th:action="@{/usuarios}" method="get" class="row g-2 mb-3">

            <div class="col-md-6">
                <input type="text" name="q" class="form-control" placeholder="Buscar por nombre" th:value="${q}">
            </div>


            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Buscar</button>
                <a th:href="@{/usuarios}" class="btn btn-secondary">Limpiar</a>
            </div>    
        </form>     
        
        <a th:href="@{/inicio}" class="btn btn-secondary">Volver al inicio</a>

    </div>


    <!-- Tabla para mostrar los usuarios que están registrados -->
    <table class="table table-striped align-middle">

        <!-- Encabezados de la tabla -->
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Cédula</th>
                <th>Correo</th>
                <th>Teléfono</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>

            <!-- Recorrer la lista de usuarios -->
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.nombre}"></td>
                <td th:text="${u.cedula}"></td>
                <td th:text="${u.email}"></td>
                <td th:text="${u.telefono}"></td>
                <td th:text="${u.rol}"></td>

                <!-- Mostrar si la cuenta está activa o inactiva -->
                <td>
                    <span class="badge"
                          th:classappend="${u.activo} ? 'bg-success' : 'bg-secondary'"
                          th:text="${u.activo} ? 'Activo' : 'Inactivo'">
                    </span>
                </td>

                <!--Acciones para cada usuario-->
                <td>
                    <a th:href="@{/usuarios/{id}/editar(id=${u.id})}" class="btn btn-primary btn-sm">Editar</a>
                </td>
            </tr>

            <!-- Mostrar mensaje si no hay usuarios registrados -->
            <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="8" class="text-center text-muted">No hay usuarios en el sistema</td>
            </tr>

        </tbody>
    </table>

</div>
</body>
</html>
